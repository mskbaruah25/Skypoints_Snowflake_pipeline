# MinIO starts by default; opt in to orchestration with --profile airflow.
# Local demonstration stack; Snowflake remains an external cloud service.
# One project Dockerfile has named targets; Compose starts the separate containers.
name: skypoints

x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://${AIRFLOW_DB_USERNAME:-admin}:${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow_metadata
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY}
  AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY}
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
  AIRFLOW__CORE__PARALLELISM: "1"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
  AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
  PYTHONPATH: /opt/airflow/src
  SKYPOINTS_DAG_ID: skypoints_ingestion
  SKYPOINTS_PROJECT_ROOT: /opt/airflow

x-airflow-dependencies: &airflow-dependencies
  airflow-db:
    condition: service_healthy
  airflow-init:
    condition: service_completed_successfully

x-airflow-common: &airflow-common
  image: skypoints-airflow:dev
  # airflow-init builds this shared image locally; consumers must not pull it.
  pull_policy: never
  environment: *airflow-environment
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./src:/opt/airflow/src:ro
    - ./scripts:/opt/airflow/scripts:ro
    - airflow-logs:/opt/airflow/logs
  networks:
    - pipeline
  restart: unless-stopped
  init: true
  mem_limit: 512m

services:
  airflow-db:
    profiles: [airflow]
    image: postgres:16.11-bookworm
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow_metadata
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      # Check the configured login too; pg_isready accepts a nonexistent username.
      test:
        - CMD-SHELL
        - 'PGPASSWORD="$${POSTGRES_PASSWORD}" psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -X -qAt -v ON_ERROR_STOP=1 -c "SELECT 1" >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - pipeline
    restart: unless-stopped
    mem_limit: 256m

  minio:
    image: skypoints-minio:dev
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: minio
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
        GO_VERSION: "1.24.8"
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_NOTIFY_WEBHOOK_ENABLE_AIRFLOW: "off"
    ports:
      # Fixed host ports: do not switch ports to work around a conflict.
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      # curl is included in the MinIO runtime image.
      test: [CMD, curl, --fail, --silent, http://localhost:9000/minio/health/ready]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pipeline
    restart: unless-stopped
    init: true
    mem_limit: 512m

  airflow-init:
    <<: *airflow-common
    profiles: [airflow]
    # Build the shared image once; all Airflow services reuse this tag.
    build:
      context: .
      dockerfile: Dockerfile
      target: airflow
      args:
        AIRFLOW_BASE_IMAGE: apache/airflow:3.4.0-python3.11
        PYSPARK_VERSION: "3.5.7"
        HADOOP_AWS_VERSION: "3.3.4"
        AWS_SDK_BUNDLE_VERSION: "1.12.262"
        SNOWFLAKE_SPARK_VERSION: 3.2.0-spark_3.5
        SNOWFLAKE_JDBC_VERSION: "4.0.2"
    # Explicit migration/bootstrap: do not bypass /entrypoint and rely on its flags.
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        airflow db migrate
        python /opt/airflow/scripts/bootstrap_airflow.py
    environment:
      <<: *airflow-environment
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD}
      AIRFLOW_REVIEWER_USERNAME: ${AIRFLOW_REVIEWER_USERNAME:-admin}
      AIRFLOW_REVIEWER_PASSWORD: ${AIRFLOW_REVIEWER_PASSWORD:?Set AIRFLOW_REVIEWER_PASSWORD}
      AIRFLOW_TRIGGER_USERNAME: ${AIRFLOW_TRIGGER_USERNAME:-admin}
      AIRFLOW_TRIGGER_PASSWORD: ${AIRFLOW_TRIGGER_PASSWORD:?Set AIRFLOW_TRIGGER_PASSWORD}
    depends_on:
      airflow-db:
        condition: service_healthy
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    profiles: [airflow]
    command: [api-server, --workers, "1"]
    ports:
      - "127.0.0.1:18080:8080"
    depends_on: *airflow-dependencies
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/v2/monitor/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  airflow-dag-processor:
    <<: *airflow-common
    profiles: [airflow]
    command: [dag-processor]
    depends_on: *airflow-dependencies
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  airflow-scheduler:
    <<: *airflow-common
    profiles: [airflow]
    command: [scheduler]
    environment:
      <<: *airflow-environment
      # Only the task runtime receives business-data credentials.
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-skypoints-landing}
      MINIO_REGION: us-east-1
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-SKYPOINTS}
      SNOWFLAKE_PRIVATE_KEY_FILE: ${SNOWFLAKE_PRIVATE_KEY_FILE:-/run/secrets/snowflake_key.p8}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${SNOWFLAKE_PRIVATE_KEY_PASSPHRASE:-}
      PYSPARK_PYTHON: /opt/spark-venv/bin/python
      SKYPOINTS_SPARK_SUBMIT: /opt/spark-venv/bin/spark-submit
      SKYPOINTS_SPARK_MASTER: local[1]
      SKYPOINTS_SPARK_DRIVER_MEMORY: 512m
      SKYPOINTS_NOTEBOOK_KERNEL: skypoints
      SKYPOINTS_NOTEBOOK_OUTPUT_DIR: /opt/airflow/logs/notebooks
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - ./scripts:/opt/airflow/scripts:ro
      - airflow-logs:/opt/airflow/logs
      # Mount the directory so an absent warehouse key does not block local startup.
      # Warehouse tasks must validate their credentials before connecting.
      - type: bind
        source: ${SNOWFLAKE_SECRETS_DIR:-./secrets}
        target: /run/secrets
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      <<: *airflow-dependencies
      airflow-api-server:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    mem_limit: 2g
    stop_grace_period: 60s

  minio-init:
    # A small one-shot image keeps MinIO startup independent of the Airflow image.
    image: skypoints-minio-init:dev
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: minio-init
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-skypoints-landing}
      MINIO_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - pipeline
    restart: "no"
    init: true
    mem_limit: 512m

  data-generator:
    # Private sibling folder: build input, not part of the pipeline source tree.
    # Manual source uploads are the default; this tool is explicitly opt-in.
    profiles: [tools]
    image: skypoints-data-generator:dev
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      target: data-generator
      additional_contexts:
        generator_source: ${DATA_GENERATOR_DIR:-../data-generator}
    command: [python, /app/generate.py]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-skypoints-landing}
      MINIO_REGION: us-east-1
      GENERATOR_BATCH_ID: ${GENERATOR_BATCH_ID:-demo-001}
      GENERATOR_SEED: ${GENERATOR_SEED:-42}
      GENERATOR_MEMBER_COUNT: ${GENERATOR_MEMBER_COUNT:-100}
      GENERATOR_AS_OF_DATE: ${GENERATOR_AS_OF_DATE:?Set GENERATOR_AS_OF_DATE}
      GENERATOR_INPUT_DIR: /input
      GENERATOR_OUTPUT_DIR: /output
      GENERATOR_UPLOAD: "true"
    volumes:
      - type: bind
        source: ${DATA_GENERATOR_DIR:-../data-generator}/input
        target: /input
        read_only: true
        bind:
          create_host_path: false
      - generator-output:/output
    depends_on:
      minio-init:
        condition: service_completed_successfully
    networks:
      - pipeline
    # One batch per invocation. A successful exit is expected, not a failed service.
    restart: "no"
    init: true
    mem_limit: 512m

volumes:
  minio-data:
  airflow-db-data:
  airflow-logs:
  generator-output:

networks:
  pipeline:
    driver: bridge
