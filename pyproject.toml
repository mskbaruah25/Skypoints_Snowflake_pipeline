[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skypoints-pipeline"
version = "0.1.0"
description = "File-driven airline loyalty ETL: MinIO, Airflow, PySpark, and Snowflake"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skypoints = "skypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
